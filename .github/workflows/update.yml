name: Update map

on:
  # Deliberately :23 and not :00. GitHub runs scheduled workflows on a shared
  # best-effort queue: when it is congested runs are silently dropped, not
  # merely delayed, and :00 is the most contended minute of the hour. At :00
  # this workflow delivered 3 of 16 expected runs, each 37-46 min late.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, scripts/**, tests/**, .github/workflows/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # No job-level env: secrets are attached to the individual steps that need
    # them, so checkout, setup-python and the Pages actions never see the
    # service account key or the passphrase in their environment.
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be repointed at
      # new code by whoever controls the action's repository; a SHA cannot.
      # Comments record the human-readable version each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Before any secret is attached to a step: if the page's status-refresh
      # loop is broken there is no point building data for it, and a failure
      # here has not yet touched the service account key. Node ships on the
      # runner, so this needs no setup step and no dependencies.
      - name: Test the page
        run: node --test tests/*.test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # --require-hashes refuses to install anything whose artifact hash is not
      # in the lockfile, so a compromised release of a dependency cannot run
      # here even though this job holds the service account key.
      - run: pip install --require-hashes -r requirements.lock

      # The cache is committed encrypted, so restore it before geocoding.
      - name: Restore geocode cache
        run: python scripts/crypto_util.py decrypt cache.enc.json build/geocode-cache.plain.json
        env:
          MAP_PASSPHRASE: ${{ secrets.MAP_PASSPHRASE }}

      - name: Fetch sheet
        run: python scripts/fetch_sheet.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Unset falls back to auto-detecting the responses tab by its headers.
          SHEET_TAB: ${{ vars.SHEET_TAB }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # Fallback copy of the up/down state for when the browser cannot reach
      # the Apps Script endpoint. Never fatal: an unreachable status sheet
      # warns and yields an empty snapshot rather than failing the map build.
      - name: Fetch billboard status
        run: python scripts/fetch_status.py
        env:
          # Unset falls back to SHEET_ID, for status tabs kept in the response
          # spreadsheet rather than one of their own.
          STATUS_SHEET_ID: ${{ secrets.STATUS_SHEET_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          STATUS_TAB: ${{ vars.STATUS_TAB }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Normalise
        run: python scripts/normalise.py

      - name: Geocode new addresses
        run: python scripts/geocode.py

      - name: Build encrypted map data
        run: python scripts/build_site.py
        env:
          MAP_PASSPHRASE: ${{ secrets.MAP_PASSPHRASE }}
          # Baked into the encrypted payload, not into index.html: the
          # deployment URL plus token is a bearer capability to write status,
          # so it sits behind the passphrase like everything else.
          STATUS_ENDPOINT: ${{ secrets.STATUS_ENDPOINT }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}

      - name: Re-encrypt geocode cache
        run: python scripts/crypto_util.py encrypt build/geocode-cache.plain.json cache.enc.json
        env:
          MAP_PASSPHRASE: ${{ secrets.MAP_PASSPHRASE }}

      # Fails loudly rather than publishing addresses if an intermediate ever
      # lands in site/. Only the encrypted envelope and static assets belong.
      - name: Guard against plaintext in site/
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          allowed = {"data.enc.json", "index.html"}
          strays = [
              str(p) for p in Path("site").rglob("*")
              if p.is_file()
              and p.parent != Path("site/vendor")
              and p.name not in allowed
          ]
          if strays:
              sys.exit(f"unexpected file(s) under site/: {strays}")

          env = json.loads(Path("site/data.enc.json").read_text())
          missing = {"v", "salt", "iv", "ct"} - set(env)
          if missing:
              sys.exit(f"site/data.enc.json is not an envelope (missing {missing})")
          if not isinstance(env["ct"], str) or len(env["ct"]) < 100:
              sys.exit("site/data.enc.json ciphertext looks empty")
          print(f"site/ clean; envelope OK ({len(env['ct'])} chars ciphertext)")
          PY

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # main can move while we are geocoding - a push, or a merged
          # Dependabot PR - and the push then fails after all the work is done.
          # Rebasing would conflict on these regenerated files, so instead move
          # HEAD to the current tip and commit the fresh artifacts on top. They
          # derive from the sheet we just read, so they are the ones that win.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            # Only the geocode cache is committed. site/data.enc.json reaches
            # Pages through the uploaded artifact and is never tracked, so a
            # locally-built copy cannot be committed over the real one.
            git add -f cache.enc.json
            if git diff --staged --quiet; then
              echo "no data change; nothing to push"
              exit 0
            fi
            git commit -q -m "Update map data [skip ci]"
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (main moved); retrying"
            sleep 5
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
