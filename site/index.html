<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>WLB26 Billboard Map</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16191d;
    --muted: #5c6672;
    --line: #dfe3e8;
    --high: #d1493f;
    --low: #3b72c4;
    --warn: #b26a00;
    --accent: #1f6f4a;
    --up: #b45f09;
    --down: #0d7a48;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --panel: #1c2126; --ink: #e9edf1; --muted: #97a2ae;
      --line: #2c333a; --high: #e8695e; --low: #6699e0; --warn: #e0a341;
      --accent: #4dab7d; --up: #ffab5e; --down: #45d18d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }

  /* ---- passphrase gate ---- */
  #gate {
    position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center;
    background: var(--bg); padding: 24px;
  }
  #gate .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px; width: min(400px, 100%); box-shadow: 0 8px 28px rgba(0,0,0,.10);
  }
  #gate h1 { font-size: 19px; margin: 0 0 6px; }
  #gate p { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
  #gate input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  #gate button {
    width: 100%; margin-top: 12px; padding: 11px; font-size: 15px; font-weight: 600;
    border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
  }
  #gate button[disabled] { opacity: .6; cursor: progress; }
  #gate label.remember {
    display: flex; gap: 8px; align-items: center; margin-top: 14px;
    font-size: 13px; color: var(--muted);
  }
  #gate .err { color: var(--high); font-size: 13.5px; margin-top: 12px; min-height: 1em; }

  /* ---- layout ---- */
  #app { display: none; height: 100%; grid-template-columns: 330px 1fr; }
  #app.ready { display: grid; }
  #side {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #map { height: 100%; }

  header.bar { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  header.bar h1 { font-size: 16px; margin: 0 0 2px; }
  header.bar .sub { font-size: 12.5px; color: var(--muted); }
  header.bar .stat { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .controls { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 8px 4px; font-size: 13px; border: 0; cursor: pointer;
    background: transparent; color: var(--muted); font-weight: 600;
  }
  .seg button.on { background: var(--accent); color: #fff; }
  select, .controls input[type=search] {
    width: 100%; padding: 9px 10px; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  label.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }

  #count { padding: 8px 16px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  #list { overflow-y: auto; flex: 1; min-height: 0; }

  /* Suburb headings stay visible while scrolling their own group. */
  .group {
    position: sticky; top: 0; z-index: 1; padding: 7px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted);
  }
  .group .n { float: right; font-weight: 600; letter-spacing: 0; }

  .item {
    padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; align-items: baseline; gap: 9px;
  }
  .item:hover { background: var(--bg); }
  .item .addr { font-weight: 600; font-size: 14px; flex: 1; }
  .pill {
    font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; color: #fff; flex: none;
  }
  .pill.high { background: var(--high); }
  .pill.low { background: var(--low); }
  .flag { color: var(--warn); font-weight: 600; }

  /* ---- sign status ---- */
  /* Priority keeps the fill colour, so state rides on the ring and the fill
     opacity instead: a pin answers "how urgent" and "is it up yet" at once. */
  .field { display: grid; gap: 5px; }
  .field[hidden] { display: none; }
  .lbl {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
  }
  .st {
    font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: .04em; flex: none;
    border: 1px solid currentColor;
  }
  .st.up { color: var(--up); }
  .st.down { color: var(--down); }
  .st.odd { color: var(--warn); }
  .item.pending { opacity: .5; }

  .popup .status { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
  .popup .status .cur { font-size: 13px; margin-bottom: 7px; }
  .popup .status .cur .meta { color: var(--muted); font-size: 12px; }
  .popup .acts { display: flex; gap: 6px; }
  .popup .acts button {
    flex: 1; padding: 7px 4px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel); color: var(--ink);
  }
  .popup .acts button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .popup .acts button[disabled] { opacity: .5; cursor: progress; }

  /* divIcon's default class paints a white box; passing our own replaces it. */
  .pin { background: none; border: 0; }

  #legend {
    flex: none; border-top: 1px solid var(--line); padding: 9px 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px;
    font-size: 12px; color: var(--muted);
  }
  #legend[hidden] { display: none; }
  #legend .k { display: flex; align-items: center; gap: 5px; }
  #legend .k svg { display: block; flex: none; }
  #legend .rule { flex-basis: 100%; height: 0; }

  #toast {
    position: fixed; z-index: 3000; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: min(420px, calc(100vw - 32px)); padding: 10px 15px; border-radius: 8px;
    background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); display: none;
  }
  #toast.show { display: block; }

  /* Leaflet hard-codes the popup card as white with #333 text, but everything
     we render inside it is themed. In dark mode that put a dark-inheriting
     name on a var(--bg) panel - invisible. Theme the chrome itself and the
     whole card follows, rather than colouring each line defensively. */
  .leaflet-popup-content-wrapper,
  .leaflet-popup-tip {
    background: var(--panel);
    color: var(--ink);
  }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }

  .popup h3 { margin: 0 0 2px; font-size: 15px; }
  .popup .sb { color: var(--muted); font-size: 13px; }
  .popup .contact {
    margin: 8px 0; padding: 8px 10px; background: var(--bg);
    border-radius: 7px; font-size: 13px; display: grid; gap: 3px;
  }
  .popup .contact .who { font-weight: 700; }
  .popup .contact a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .popup .contact a:hover { text-decoration: underline; }
  .popup .nocontact { margin: 8px 0; font-size: 12.5px; color: var(--muted); font-style: italic; }
  .popup dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
  .popup dt { color: var(--muted); }
  .popup dd { margin: 0; }
  .popup .review {
    margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
    color: var(--warn); font-size: 12px;
  }

  #toggle {
    display: none; position: fixed; z-index: 1000; left: 12px; bottom: 12px;
    padding: 11px 16px; border: 0; border-radius: 999px; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 3px 12px rgba(0,0,0,.28);
  }
  /* Only reachable on mobile, where the list covers the whole map. */
  #dismiss {
    display: none; margin-left: auto; padding: 7px 13px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--bg); color: var(--ink);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  header.bar { display: flex; align-items: flex-start; gap: 10px; }
  header.bar .titles { min-width: 0; }
  @media (max-width: 760px) {
    #app.ready { grid-template-columns: 1fr; }
    #side {
      position: fixed; inset: 0; z-index: 1100; border-right: 0;
      transform: translateY(100%); transition: transform .22s ease;
    }
    #side.open { transform: none; }
    #toggle { display: block; }
    #dismiss { display: block; }
  }
</style>
</head>
<body>

<div id="gate">
  <form class="card" id="gateForm">
    <h1>WLB26 Billboard Map</h1>
    <p>This map contains supporter addresses. Enter the shared passphrase to unlock it.</p>
    <input type="password" id="pass" autocomplete="current-password" placeholder="Passphrase" autofocus>
    <label class="remember"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button type="submit" id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app">
  <aside id="side">
    <header class="bar">
      <div class="titles">
        <h1>Billboard requests</h1>
        <div class="sub" id="generated"></div>
        <div class="stat" id="statusline"></div>
      </div>
      <button id="dismiss" type="button">Close</button>
    </header>
    <div class="controls">
      <div class="field">
        <span class="lbl">Priority</span>
        <div class="seg" id="prio">
          <button data-p="all" class="on">All</button>
          <button data-p="high">High</button>
          <button data-p="low">Low</button>
        </div>
      </div>
      <!-- Revealed only once status tracking is configured, or once the baked
           snapshot carries at least one state. -->
      <div class="field" id="stateField" hidden>
        <span class="lbl">Sign status</span>
        <div class="seg" id="stateSeg">
          <button data-s="all" class="on">All</button>
          <button data-s="up">Up</button>
          <button data-s="down">Down</button>
          <button data-s="unset">Unset</button>
        </div>
      </div>
      <select id="suburb"><option value="">All suburbs</option></select>
      <input type="search" id="search" placeholder="Search street or notes…">
      <label class="check"><input type="checkbox" id="onlyReview"> Only ones needing review</label>
    </div>
    <div id="count"></div>
    <div id="list"></div>
    <div id="legend" hidden></div>
  </aside>
  <div id="map"></div>
</div>
<button id="toggle">List</button>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "wlb26-map-pass";
  var WHO = "wlb26-map-who";
  var data = null, map = null, layer = null, markers = {}, listEls = {};
  var byId = {};        // id -> feature; status updates mutate these in place
  var pending = {};     // id -> true while a status write is in flight
  // cfg is null until status tracking is configured; live says whether the
  // endpoint answered, which is the difference between "3 down" and "3 down as
  // of the last build".
  var sync = { cfg: null, live: false, error: "" };
  var filters = { priority: "all", suburb: "", q: "", review: false, state: "all" };

  /* ---------- crypto ---------- */
  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function decrypt(env, pass) {
    var base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(env.salt), iterations: env.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function store(pass, on) {
    try { on ? localStorage.setItem(KEY, pass) : localStorage.removeItem(KEY); } catch (e) {}
  }
  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  /* ---------- gate ---------- */
  var gate = document.getElementById("gate"),
      form = document.getElementById("gateForm"),
      passInput = document.getElementById("pass"),
      errBox = document.getElementById("err"),
      unlockBtn = document.getElementById("unlock");

  var envelope = fetch("data.enc.json", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("could not load map data (" + r.status + ")");
    return r.json();
  });

  async function attempt(pass, remember) {
    var env = await envelope;
    var payload = await decrypt(env, pass);   // throws if the passphrase is wrong
    store(pass, remember);
    data = payload;
    gate.style.display = "none";
    document.getElementById("app").classList.add("ready");
    start();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errBox.textContent = "";
    unlockBtn.disabled = true;
    unlockBtn.textContent = "Unlocking…";
    attempt(passInput.value, document.getElementById("remember").checked)
      .catch(function (err) {
        errBox.textContent = /load map data/.test(err.message)
          ? err.message : "That passphrase didn't work.";
        passInput.select();
      })
      .finally(function () {
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Unlock";
      });
  });

  var saved = stored();
  if (saved) attempt(saved, true).catch(function () { store(null, false); });

  /* ---------- map ---------- */
  function needsReview(f) {
    return f.properties.confidence !== "exact";
  }

  /* ---------- sign status ---------- */

  // A hand-edited sheet can hold anything, so only the two known values get
  // their own bucket. Anything else falls in with "unset", which is the pile
  // someone still has to deal with - exactly where a typo belongs.
  function bucket(state) {
    return state === "up" ? "up" : state === "down" ? "down" : "unset";
  }

  // Colouring, unlike filtering, keeps unrecognised values distinct: they
  // belong in the "unset" pile to work through, but they should look like the
  // sheet typo they are rather than like an address nobody has reached yet.
  function chipClass(state) {
    return state === "up" ? "up" : state === "down" ? "down" : "odd";
  }

  // Status is carried by SHAPE first and colour second. Shape survives any
  // colour vision deficiency and a greyscale print, which frees the palette to
  // be as bright as it likes - the earlier scheme had to trade saturation for
  // luminance separation to stay readable, and looked muted for it.
  var STATUS_SHAPE = { up: "triangle", unset: "circle", down: "square" };
  var STATUS_FILL = { up: "#ff8a1f", down: "#12c26a", unset: "#aab2bd" };
  var PRIORITY_RING = { high: "#e01b24", low: "#1a73e8" };

  // Leaflet computes a marker's z-index as (pixel y + zIndexOffset), and pixel
  // y runs into the thousands, so the offsets have to be far larger than any
  // plausible y to guarantee the stacking order rather than merely nudge it.
  var STATUS_Z = { up: 3000000, unset: 2000000, down: 1000000 };

  var PIN_SIZE = { high: 30, low: 24 };

  // Drawn twice: a white halo underneath so the priority ring reads against
  // whatever map tile is behind it, then the shape itself. The halo is what
  // lets the ring and fill both stay saturated without muddying each other.
  function shapeSVG(shape, size, fill, ring) {
    var body;
    if (shape === "triangle") body = '<polygon points="12,2.6 21.6,20 2.4,20"';
    else if (shape === "square") body = '<rect x="4" y="4" width="16" height="16" rx="2"';
    else body = '<circle cx="12" cy="12" r="8.2"';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" ' +
      'xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      body + ' fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round"/>' +
      body + ' fill="' + fill + '" stroke="' + ring + '" stroke-width="2.6" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function pinIcon(f) {
    var p = f.properties;
    var key = bucket(p.state);
    var size = PIN_SIZE[p.priority] || PIN_SIZE.low;
    return L.divIcon({
      className: "pin",
      html: shapeSVG(STATUS_SHAPE[key], size, STATUS_FILL[key],
                     PRIORITY_RING[p.priority] || PRIORITY_RING.low),
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
      popupAnchor: [0, -size / 2]
    });
  }

  function pinZ(f) { return STATUS_Z[bucket(f.properties.state)]; }

  // Built from the same function that draws the pins, so the key cannot drift
  // away from the map it describes.
  function buildLegend(showStatus) {
    var parts = [];
    if (showStatus) {
      [["up", "Up"], ["unset", "Not set"], ["down", "Down"]].forEach(function (kv) {
        parts.push('<span class="k">' +
          shapeSVG(STATUS_SHAPE[kv[0]], 18, STATUS_FILL[kv[0]], "#7c8592") +
          esc(kv[1]) + "</span>");
      });
      parts.push('<span class="rule"></span>');
    }
    [["high", "High priority"], ["low", "Low priority"]].forEach(function (kv) {
      parts.push('<span class="k">' +
        shapeSVG("circle", 18, "#ffffff", PRIORITY_RING[kv[0]]) + esc(kv[1]) + "</span>");
    });
    var el = document.getElementById("legend");
    el.innerHTML = parts.join("");
    el.hidden = false;
  }

  function shortDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function actionButton(id, act, text, on, busy) {
    return '<button type="button" data-id="' + esc(id) + '" data-act="' + esc(act) +
      '"' + (on ? ' class="on"' : "") + (busy ? " disabled" : "") + ">" + esc(text) +
      "</button>";
  }

  function statusBlock(f) {
    var p = f.properties;
    var state = p.state;
    var label = state === "up" ? "Up"
      : state === "down" ? "Down"
      : state ? esc(state) + " (unrecognised)"
      : "Not set";

    var meta = [];
    if (p.state_by) meta.push("by " + esc(p.state_by));
    if (p.state_updated) meta.push(esc(shortDate(p.state_updated)));

    var html = '<div class="status"><div class="cur">Sign: <b>' + label + "</b>" +
      (meta.length ? ' <span class="meta">' + meta.join(" · ") + "</span>" : "") +
      "</div>";

    // Buttons only exist when there is somewhere to write to. Without an
    // endpoint the card still reports the state baked in at build time.
    if (sync.cfg) {
      var busy = !!pending[p.id];
      html += '<div class="acts">' +
        actionButton(p.id, "up", "Mark up", state === "up", busy) +
        actionButton(p.id, "down", "Mark down", state === "down", busy) +
        actionButton(p.id, "", "Clear", false, busy) +
        "</div>";
    }
    return html + "</div>";
  }

  function itemHTML(f) {
    var p = f.properties;
    return '<span class="addr">' + esc(p.street) + "</span>" +
      (p.state ? '<span class="st ' + chipClass(p.state) + '">' + esc(p.state) + "</span>" : "") +
      '<span class="pill ' + esc(p.priority) + '">' + esc(p.priority) + "</span>";
  }

  var toastTimer = null;
  function toast(message) {
    var el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 6000);
  }

  // Asked once and remembered. This is a courtesy label for the log, not
  // identity - the passphrase is the only thing that actually authorises.
  function who() {
    var name = null;
    try { name = localStorage.getItem(WHO); } catch (e) {}
    if (!name) {
      name = (window.prompt("Your name (recorded against status changes):") || "").trim();
      if (name) { try { localStorage.setItem(WHO, name); } catch (e) {} }
    }
    return name || "unknown";
  }

  function updateStatusLine() {
    var el = document.getElementById("statusline");
    var up = 0, down = 0;
    data.geojson.features.forEach(function (f) {
      if (f.properties.state === "up") up++;
      else if (f.properties.state === "down") down++;
    });

    if (!sync.cfg && !up && !down) { el.textContent = ""; return; }
    var source = !sync.cfg ? "read-only"
      : sync.live ? "live"
      : "offline — as at " + data.generated;
    el.textContent = up + " up · " + down + " down · " + source;
  }

  /* Apps Script web apps do not answer a CORS preflight, so both calls have to
     stay "simple" requests: no custom headers, which is why the token travels
     in the query string and the body rather than in an Authorization header,
     and why the POST is sent as text/plain despite carrying JSON. */

  function fetchStates() {
    if (!sync.cfg) return Promise.resolve(false);
    return fetch(sync.cfg.endpoint + "?token=" + encodeURIComponent(sync.cfg.token),
                 { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("endpoint returned " + r.status);
        return r.json();
      })
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || "rejected");
        Object.keys(res.states || {}).forEach(function (id) {
          var f = byId[id];
          if (!f) return;   // a status row for an address no longer in the form
          var s = res.states[id];
          f.properties.state = s.state || "";
          f.properties.state_updated = s.updated || "";
          f.properties.state_by = s.by || "";
          f.properties.state_note = s.note || "";
        });
        sync.live = true;
        return true;
      })
      .catch(function (err) {
        // Keep the baked snapshot rather than blanking every pin: a pin with no
        // status reads as "nobody has been here yet", which is a lie that sends
        // someone to the same address twice.
        sync.live = false;
        sync.error = err.message;
        return false;
      });
  }

  function post(body) {
    body.token = sync.cfg.token;
    return fetch(sync.cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("endpoint returned " + r.status);
      return r.json();
    }).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || "rejected");
      return res;
    });
  }

  // Repaint one record without rebuilding the map, so the open card stays open
  // and the list keeps its scroll position. Falls back to a full render when
  // the new state means the record no longer passes the filters.
  function refreshOne(id) {
    var f = byId[id];
    if (!f) return;
    if (!markers[id] || !passes(f)) { render(); return; }
    markers[id].setIcon(pinIcon(f));
    markers[id].setZIndexOffset(pinZ(f));
    markers[id].setPopupContent(popup(f));
    var el = listEls[id];
    if (el) {
      el.innerHTML = itemHTML(f);
      el.classList.toggle("pending", !!pending[id]);
    }
    updateStatusLine();
  }

  function setState(id, next) {
    var f = byId[id];
    if (!f || !sync.cfg || pending[id]) return;
    var p = f.properties;
    if (p.state === next) return;

    var before = { state: p.state, updated: p.state_updated, by: p.state_by };
    var name = who();

    // Optimistic: the field team is on mobile data, and waiting a second per
    // tap for a round trip makes the map feel broken.
    pending[id] = true;
    p.state = next;
    p.state_updated = new Date().toISOString();
    p.state_by = name;
    refreshOne(id);

    post({
      id: id, street: p.street, suburb: p.suburb,
      state: next, by: name, note: p.state_note || ""
    }).then(function (res) {
      pending[id] = false;
      p.state_updated = res.updated || p.state_updated;
      sync.live = true;
      refreshOne(id);
    }).catch(function (err) {
      pending[id] = false;
      p.state = before.state;
      p.state_updated = before.updated;
      p.state_by = before.by;
      refreshOne(id);
      toast("Could not save that change: " + err.message);
    });
  }

  // Sort within a suburb by street name, not by the leading house number, so
  // "9b Douglas" and "112 Ohiro" land under D and O rather than 9 and 112.
  function streetName(s) {
    return s.replace(/^\s*[\w/]*\d[\w/]*\s*/, "").toLowerCase() || s.toLowerCase();
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function contactBlock(p) {
    // tel: chokes on spaces and parentheses; the visible text keeps them.
    var bits = [];
    if (p.name) bits.push('<div class="who">' + esc(p.name) + "</div>");
    if (p.phone) {
      bits.push('<div><a href="tel:' + esc(p.phone.replace(/[^\d+]/g, "")) +
        '">' + esc(p.phone) + "</a></div>");
    }
    if (p.email) {
      bits.push('<div><a href="mailto:' + esc(p.email) + '">' + esc(p.email) + "</a></div>");
    }
    return bits.length
      ? '<div class="contact">' + bits.join("") + "</div>"
      : '<div class="nocontact">No contact details on this response.</div>';
  }

  function popup(f) {
    var p = f.properties;
    var rows = [
      ["Priority", p.priority], ["Property", p.property_type],
      ["Sign goes", p.sign_location], ["Mounting", p.mounting],
      ["Poster size", p.poster_size], ["Permission", p.permission],
      ["Their home", p.is_home], ["Notes", p.notes]
    ].filter(function (r) { return r[1]; });

    var html = '<div class="popup"><h3>' + esc(p.street) + "</h3>" +
      '<div class="sb">' + esc(p.suburb) + "</div>" +
      contactBlock(p) + "<dl>" +
      rows.map(function (r) {
        return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>";
      }).join("") + "</dl>";

    // Below the details, not above them: opening a card is a read, and the one
    // control that writes should not sit where a thumb lands while scrolling.
    html += statusBlock(f);

    // Geocoding quality is a caveat on the data, not a headline: it sits last,
    // next to the raw match it is a caveat about.
    if (needsReview(f)) {
      html += '<div class="review">Approximate pin — ' + esc(p.confidence) +
        "-level match, so the number may be off.<br>Geocoder returned: " +
        esc(p.matched.split(",").slice(0, 3).join(",")) + "</div>";
    }
    return html + "</div>";
  }

  function passes(f) {
    var p = f.properties;
    if (filters.priority !== "all" && p.priority !== filters.priority) return false;
    if (filters.suburb && p.suburb !== filters.suburb) return false;
    if (filters.review && !needsReview(f)) return false;
    if (filters.state !== "all" && bucket(p.state) !== filters.state) return false;
    if (filters.q) {
      var hay = (p.street + " " + p.suburb + " " + p.name + " " + p.email + " " +
        p.notes + " " + p.mounting + " " + p.state + " " + p.state_by).toLowerCase();
      if (hay.indexOf(filters.q) === -1) return false;
    }
    return true;
  }

  function render() {
    var shown = data.geojson.features.filter(passes);
    layer.clearLayers();
    markers = {};
    listEls = {};

    shown.forEach(function (f) {
      var c = f.geometry.coordinates;
      // Shape and fill encode sign status, the ring encodes priority, and the
      // stacking order puts the ones already up above the ones still to do.
      // Match confidence stays a caveat inside the card, not something worth
      // reading the whole map through.
      var m = L.marker([c[1], c[0]], {
        icon: pinIcon(f), zIndexOffset: pinZ(f), keyboard: false
      }).bindPopup(popup(f));
      markers[f.properties.id] = m;
      layer.addLayer(m);
    });

    var high = shown.filter(function (f) { return f.properties.priority === "high"; }).length;
    var groups = {};
    shown.forEach(function (f) {
      var key = f.properties.suburb || "Unknown suburb";
      (groups[key] = groups[key] || []).push(f);
    });
    var suburbNames = Object.keys(groups).sort(function (a, b) {
      return a.localeCompare(b);
    });

    document.getElementById("count").textContent =
      shown.length + " shown · " + high + " high priority · " +
      suburbNames.length + " suburb" + (suburbNames.length === 1 ? "" : "s");

    var list = document.getElementById("list");
    list.innerHTML = "";

    suburbNames.forEach(function (suburb) {
      var heading = document.createElement("div");
      heading.className = "group";
      heading.innerHTML = esc(suburb) +
        '<span class="n">' + groups[suburb].length + "</span>";
      list.appendChild(heading);

      groups[suburb].slice().sort(function (a, b) {
        var pa = a.properties, pb = b.properties;
        if (pa.priority !== pb.priority) return pa.priority === "high" ? -1 : 1;
        var na = streetName(pa.street), nb = streetName(pb.street);
        if (na !== nb) return na.localeCompare(nb);
        return pa.street.localeCompare(pb.street, undefined, { numeric: true });
      }).forEach(function (f) {
        var p = f.properties;
        var el = document.createElement("div");
        el.className = "item" + (pending[p.id] ? " pending" : "");
        el.innerHTML = itemHTML(f);
        listEls[p.id] = el;
        el.addEventListener("click", function () {
          var m = markers[p.id];
          map.setView(m.getLatLng(), 17);
          m.openPopup();
          document.getElementById("side").classList.remove("open");
        });
        list.appendChild(el);
      });
    });

    if (data.unplaced.length) {
      var head = document.createElement("div");
      head.className = "item";
      head.style.cursor = "default";
      head.innerHTML = '<div class="addr flag">' + data.unplaced.length +
        " could not be placed</div><div class=\"meta\">" +
        data.unplaced.map(function (u) { return esc(u.street + ", " + u.suburb); }).join("<br>") +
        "</div>";
      list.appendChild(head);
    }
  }

  function start() {
    document.getElementById("generated").textContent =
      data.counts.mapped + " of " + data.counts.total + " mapped · updated " + data.generated;

    data.geojson.features.forEach(function (f) { byId[f.properties.id] = f; });

    // Endpoint and token ride inside the encrypted payload, so an unauthorised
    // visitor never sees them. Absent, the map degrades to read-only status.
    sync.cfg = (data.status && data.status.endpoint && data.status.token)
      ? data.status : null;
    var anyState = data.geojson.features.some(function (f) { return !!f.properties.state; });
    var showStatus = !!(sync.cfg || anyState);
    if (showStatus) document.getElementById("stateField").hidden = false;
    buildLegend(showStatus);

    map = L.map("map", { zoomControl: true }).setView([-41.31, 174.78], 13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    layer = L.layerGroup().addTo(map);

    var subs = {};
    data.geojson.features.forEach(function (f) { subs[f.properties.suburb] = 1; });
    var sel = document.getElementById("suburb");
    Object.keys(subs).sort().forEach(function (s) {
      var o = document.createElement("option");
      o.value = o.textContent = s;
      sel.appendChild(o);
    });

    sel.addEventListener("change", function () { filters.suburb = this.value; render(); });
    document.getElementById("search").addEventListener("input", function () {
      filters.q = this.value.trim().toLowerCase(); render();
    });
    document.getElementById("onlyReview").addEventListener("change", function () {
      filters.review = this.checked; render();
    });
    document.querySelectorAll("#prio button").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll("#prio button").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
        filters.priority = b.dataset.p;
        render();
      });
    });
    document.querySelectorAll("#stateSeg button").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll("#stateSeg button").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
        filters.state = b.dataset.s;
        render();
      });
    });

    // Delegated because popup markup is rebuilt as a string on every repaint.
    // Opening a card never changes anything; only these buttons do.
    document.addEventListener("click", function (e) {
      var btn = e.target && e.target.closest && e.target.closest("[data-act]");
      if (!btn) return;
      setState(btn.getAttribute("data-id"), btn.getAttribute("data-act"));
    });
    document.getElementById("toggle").addEventListener("click", function () {
      document.getElementById("side").classList.toggle("open");
    });
    document.getElementById("dismiss").addEventListener("click", function () {
      document.getElementById("side").classList.remove("open");
    });

    render();
    updateStatusLine();
    var pts = data.geojson.features.map(function (f) {
      return [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    });
    if (pts.length) map.fitBounds(pts, { padding: [40, 40] });

    // Snapshot first so the map paints immediately; live status overlays it
    // when it lands, typically alongside the key derivation that just ran.
    fetchStates().then(function (ok) {
      if (ok) render();
      updateStatusLine();
      if (!ok && sync.cfg) toast("Showing saved status — could not reach the status sheet.");
    });
  }
})();
</script>
</body>
</html>
